components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrganizationIdQuery:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid

    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PullRequestId:
      name: pullRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid

    RepositoryIdQuery:
      name: repositoryId
      in: query
      schema:
        type: string
        format: uuid

    PullRequestStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - open
          - closed
          - merged

    PullRequestSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - createdAt
          - number

    InsightKey:
      name: insightKey
      in: path
      required: true
      schema:
        type: string

    InsightType:
      name: type
      in: query
      schema:
        type: string
        enum:
          - bottleneck_detection
          - large_pr_detection
          - slow_review_detection
          - hotspot_detection
          - deployment_failure_trend
          - review_concentration

    InsightStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - open
          - reviewed
          - dismissed

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Search:
      name: search
      in: query
      schema:
        type: string

    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        example: createdAt

    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc

    RepositoryStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - inactive
          - archived

    SyncStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - pending
          - running
          - completed
          - failed

    DateFrom:
      name: from
      in: query
      required: true
      description: Inclusive start date
      schema:
        type: string
        format: date

    DateTo:
      name: to
      in: query
      required: true
      description: Inclusive end date
      schema:
        type: string
        format: date

    Interval:
      name: interval
      in: query
      schema:
        type: string
        enum:
          - day
          - week
          - month
        default: day

    Environment:
      name: environment
      in: query
      schema:
        type: string
        example: production

  responses:
    Unauthorized:
      description: Authentication is required or token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: User does not have permission to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required:
            - postgres
            - clickhouse
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            clickhouse:
              $ref: "#/components/schemas/DependencyStatus"

    DependencyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
        message:
          type: string

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    Organization:
      type: object
      required:
        - id
        - githubId
        - slug
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        githubId:
          type: integer
          format: int64
        slug:
          type: string
          example: devlens
        name:
          type: string
          example: DevLens
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateOrganizationRequest:
      type: object
      required:
        - githubId
        - slug
        - name
      properties:
        githubId:
          type: integer
          format: int64
          example: 123456
        slug:
          type: string
          example: devlens
        name:
          type: string
          example: DevLens

    UpdateOrganizationRequest:
      type: object
      properties:
        slug:
          type: string
          example: devlens-platform
        name:
          type: string
          example: DevLens Platform

    OrganizationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Organization"

    OrganizationListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    CreateOrganizationMemberRequest:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - admin
            - member

    UpdateOrganizationMemberRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - member

    OrganizationMember:
      type: object
      required:
        - id
        - organizationId
        - userId
        - role
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - admin
            - member

    OrganizationMemberResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/OrganizationMember"

    OrganizationMemberListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"

    Repository:
      type: object
      required:
        - id
        - organizationId
        - githubId
        - name
        - fullName
        - isActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        githubId:
          type: integer
          format: int64
        name:
          type: string
          example: devlens-api
        fullName:
          type: string
          example: devlens-labs/devlens-api
        defaultBranch:
          type: string
          example: main
          nullable: true
        isActive:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    GitHubConnection:
      type: object
      required:
        - organizationId
        - state
        - provider
      properties:
        organizationId:
          type: string
          format: uuid
        provider:
          type: string
          example: github
        state:
          type: string
          enum:
            - not_connected
            - installation_required
            - connected
            - syncing
            - sync_failed
        installationId:
          type: integer
          format: int64
          nullable: true
        accountLogin:
          type: string
          nullable: true
        accountType:
          type: string
          enum:
            - User
            - Organization
          nullable: true
        targetType:
          type: string
          enum:
            - account
            - organization
            - selected_repositories
          nullable: true
        reconnectRequired:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncError:
          type: string
          nullable: true
        connectedRepositories:
          type: integer
          example: 3

    GitHubConnectionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/GitHubConnection"

    StartGitHubInstallationRequest:
      type: object
      properties:
        redirectUrl:
          type: string
          format: uri
          nullable: true

    StartGitHubInstallation:
      type: object
      required:
        - installUrl
        - state
      properties:
        installUrl:
          type: string
          format: uri
        state:
          type: string
          description: Opaque backend-generated state for installation flow correlation

    StartGitHubInstallationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/StartGitHubInstallation"

    GitHubAccessibleRepository:
      type: object
      required:
        - githubRepositoryId
        - fullName
        - private
        - installationStatus
        - selectionStatus
      properties:
        githubRepositoryId:
          type: integer
          format: int64
        fullName:
          type: string
          example: devlens-labs/devlens-api
        name:
          type: string
          example: devlens-api
        ownerLogin:
          type: string
          example: devlens-labs
        private:
          type: boolean
        defaultBranch:
          type: string
          nullable: true
        installationStatus:
          type: string
          enum:
            - accessible
            - permission_missing
            - installation_required
            - suspended
        selectionStatus:
          type: string
          enum:
            - not_selected
            - selected
            - syncing
            - sync_failed
            - synced
        linkedRepositoryId:
          type: string
          format: uuid
          nullable: true
        lastSyncError:
          type: string
          nullable: true

    GitHubAccessibleRepositoryListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GitHubAccessibleRepository"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    SelectGitHubRepositoriesRequest:
      type: object
      required:
        - repositoryIds
      properties:
        repositoryIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        autoSync:
          type: boolean
          default: true

    GitHubRepositorySelection:
      type: object
      required:
        - state
        - selectedRepositoryIds
      properties:
        state:
          type: string
          enum:
            - connected
            - syncing
            - sync_failed
        selectedRepositoryIds:
          type: array
          items:
            type: integer
            format: int64
        createdRepositoryIds:
          type: array
          items:
            type: string
            format: uuid
        syncJobIds:
          type: array
          items:
            type: string
            format: uuid

    GitHubRepositorySelectionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/GitHubRepositorySelection"

    CreateRepositoryRequest:
      type: object
      required:
        - githubId
        - name
        - fullName
      properties:
        githubId:
          type: integer
          format: int64
          example: 123456789
        name:
          type: string
          example: devlens-api
        fullName:
          type: string
          example: devlens-labs/devlens-api
        defaultBranch:
          type: string
          example: main
          nullable: true

    UpdateRepositoryRequest:
      type: object
      properties:
        name:
          type: string
          example: devlens-api
        fullName:
          type: string
          example: devlens-labs/devlens-api
        defaultBranch:
          type: string
          example: main
          nullable: true
        isActive:
          type: boolean
        archived:
          type: boolean

    RepositoryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Repository"

    RepositoryListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    UserProfile:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
