openapi: 3.0.3

info:
  title: DevLens API
  version: 1.0.0
  description: |
    API contract สำหรับ DevLens Engineering Intelligence Platform

    Related documents:
    - 01-business-logic-architecture.md
    - 03-backend-roadmap.md
    - 04-metric-definitions.md
    - 05-database-design.dbml
    - 06-api-design.md

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Organizations
  - name: GitHub Connections
  - name: Pull Requests
  - name: Repositories
  - name: Sync Jobs
  - name: GitHub Webhooks
  - name: Dashboard
  - name: Pull Request Metrics
  - name: Review Metrics
  - name: Deployment Metrics
  - name: Hotspots
  - name: Insights

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Create a user session
      description: Creates or updates a user record by email and returns an access token plus refresh token for the new session.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh an existing session
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      operationId: logout
      responses:
        "204":
          description: Session revoked successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Returns the currently authenticated user profile.
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readiness:
    get:
      tags:
        - Health
      summary: Check API readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /organizations:
    post:
      tags:
        - Organizations
      summary: Create organization
      description: Creates an organization and assigns the authenticated user as the initial owner.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Organizations
      summary: Get organizations accessible by current user
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{organizationId}:
    get:
      tags:
        - Organizations
      summary: Get organization detail
      operationId: getOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Organizations
      summary: Update organization
      operationId: updateOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Organizations
      summary: Soft delete organization
      operationId: deleteOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Organization deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    get:
      tags:
        - Organizations
      summary: Get organization members
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Organizations
      summary: Add organization member
      operationId: createOrganizationMember
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationMemberRequest"
      responses:
        "201":
          description: Organization member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/members/{memberId}:
    patch:
      tags:
        - Organizations
      summary: Update organization member role
      operationId: updateOrganizationMember
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRequest"
      responses:
        "200":
          description: Organization member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Organizations
      summary: Remove organization member
      operationId: deleteOrganizationMember
      description: This milestone uses hard delete for organization members because `organization_members.deleted_at` is not defined in PostgreSQL schema yet.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Organization member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/repositories:
    post:
      tags:
        - Repositories
      summary: Create repository under an organization
      operationId: createRepository
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryRequest"
      responses:
        "201":
          description: Repository created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Repositories
      summary: Get repositories in an organization
      operationId: listRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RepositoryStatus"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"

  /organizations/{organizationId}/github/connection:
    get:
      tags:
        - GitHub Connections
      summary: Get GitHub connection status for an organization
      operationId: getGitHubConnection
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: GitHub connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/installations/start:
    post:
      tags:
        - GitHub Connections
      summary: Start GitHub App installation flow for an organization
      operationId: startGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGitHubInstallationRequest"
      responses:
        "200":
          description: Installation flow started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGitHubInstallationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/installations/callback:
    get:
      tags:
        - GitHub Connections
      summary: Complete GitHub App installation callback
      operationId: completeGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: installation_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
            example: install
      responses:
        "200":
          description: Installation callback handled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/repositories:
    get:
      tags:
        - GitHub Connections
      summary: List repositories accessible from the GitHub App installation
      operationId: listAccessibleGitHubRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Accessible repository list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccessibleRepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/repositories/select:
    post:
      tags:
        - GitHub Connections
      summary: Select accessible GitHub repositories to connect and sync
      operationId: selectAccessibleGitHubRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectGitHubRepositoriesRequest"
      responses:
        "202":
          description: Repository selection accepted and initial sync scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositorySelectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /repositories/{repositoryId}:
    get:
      tags:
        - Repositories
      summary: Get repository detail
      operationId: getRepository
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: Repository detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /pull-requests/{pullRequestId}:
    get:
      tags:
        - Pull Requests
      summary: Get pull request detail
      operationId: getPullRequest
      parameters:
        - $ref: "#/components/parameters/PullRequestId"
      responses:
        "200":
          description: Pull request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /pull-requests:
    get:
      tags:
        - Pull Requests
      summary: List pull requests for a repository
      operationId: listPullRequests
      parameters:
        - $ref: "#/components/parameters/RepositoryIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/PullRequestStatus"
        - $ref: "#/components/parameters/PullRequestSortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Pull request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Repositories
      summary: Update repository state or metadata
      operationId: updateRepository
      description: Use this endpoint to rename, change default branch, deactivate, or archive a repository without deleting historical records.
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
      responses:
        "200":
          description: Repository updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /repositories/{repositoryId}/sync:
    post:
      tags:
        - Sync Jobs
      summary: Start repository synchronization
      operationId: createRepositorySync
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSyncRequest"
      responses:
        "202":
          description: Sync job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /repositories/{repositoryId}/sync-jobs:
    get:
      tags:
        - Sync Jobs
      summary: Get repository synchronization history
      operationId: listRepositorySyncJobs
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SyncStatus"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Sync job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sync-jobs/{syncJobId}:
    get:
      tags:
        - Sync Jobs
      summary: Get synchronization job detail
      operationId: getSyncJob
      parameters:
        - $ref: "#/components/parameters/SyncJobId"
      responses:
        "200":
          description: Sync job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sync-jobs/{syncJobId}/retry:
    post:
      tags:
        - Sync Jobs
      summary: Retry a failed synchronization job
      operationId: retrySyncJob
      parameters:
        - $ref: "#/components/parameters/SyncJobId"
      responses:
        "202":
          description: Sync job re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sync-jobs/{syncJobId}/cancel:
    post:
      tags:
        - Sync Jobs
      summary: Cancel a pending or running synchronization job
      operationId: cancelSyncJob
      parameters:
        - $ref: "#/components/parameters/SyncJobId"
      responses:
        "202":
          description: Sync job canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /github/webhook:
    post:
      tags:
        - GitHub Webhooks
      summary: Receive GitHub webhook deliveries
      operationId: handleGitHubWebhook
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/github:
    post:
      tags:
        - GitHub Webhooks
      summary: Receive GitHub webhook deliveries
      operationId: handleGitHubWebhookAlias
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /github/webhook-deliveries/{deliveryId}/retry:
    post:
      tags:
        - GitHub Webhooks
      summary: Retry a failed GitHub webhook delivery
      operationId: retryGitHubWebhookDelivery
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Webhook delivery retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /repositories/{repositoryId}/dashboard/summary:
    get:
      tags:
        - Dashboard
      summary: Get repository dashboard summary
      operationId: getDashboardSummary
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /repositories/{repositoryId}/dashboard/pr-cycle-time:
    get:
      tags:
        - Dashboard
      summary: Get dashboard PR cycle time metrics
      operationId: getDashboardPullRequestCycleTime
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
