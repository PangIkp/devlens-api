components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrganizationIdQuery:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid

    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PullRequestId:
      name: pullRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid

    RepositoryIdQuery:
      name: repositoryId
      in: query
      schema:
        type: string
        format: uuid

    PullRequestStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - open
          - closed
          - merged

    PullRequestSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
          - createdAt
          - number

    InsightKey:
      name: insightKey
      in: path
      required: true
      schema:
        type: string

    InsightType:
      name: type
      in: query
      schema:
        type: string
        enum:
          - bottleneck_detection
          - large_pr_detection
          - slow_review_detection
          - hotspot_detection
          - deployment_failure_trend
          - review_concentration

    InsightStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - open
          - reviewed
          - dismissed

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Search:
      name: search
      in: query
      schema:
        type: string

    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        example: createdAt

    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc

    RepositoryStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - inactive
          - archived

    SyncStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - pending
          - running
          - completed
          - failed

    DateFrom:
      name: from
      in: query
      required: true
      description: Inclusive start date
      schema:
        type: string
        format: date

    DateTo:
      name: to
      in: query
      required: true
      description: Inclusive end date
      schema:
        type: string
        format: date

    Interval:
      name: interval
      in: query
      schema:
        type: string
        enum:
          - day
          - week
          - month
        default: day

    DayType:
      name: dayType
      in: query
      description: Controls how per-day normalized metrics such as deployment frequency are divided across the selected range. Duration metrics still use elapsed calendar time. When omitted, the backend uses its configured metric rule default.
      schema:
        type: string
        enum:
          - calendar
          - business

    Environment:
      name: environment
      in: query
      schema:
        type: string
        example: production

  responses:
    Unauthorized:
      description: Authentication is required or token is invalid
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: User does not have permission to access the resource
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Requested resource was not found
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Request conflicts with current resource state
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    TooManyRequests:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Number of seconds to wait before retrying the request.
        X-Trace-Id:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  headers:
    TraceID:
      description: Request trace identifier for correlating logs and responses.
      schema:
        type: string
        example: 7b0ce8d6611b40e5b32ea3cbe3d98d0a

  schemas:
    LivenessHealthResponse:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required:
            - postgres
            - clickhouse
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            clickhouse:
              $ref: "#/components/schemas/DependencyStatus"

    ReadinessHealthResponse:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required:
            - postgres
            - clickhouse
            - nats
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            clickhouse:
              $ref: "#/components/schemas/DependencyStatus"
            nats:
              $ref: "#/components/schemas/DependencyStatus"

    DependencyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
        message:
          type: string

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    Organization:
      type: object
      required:
        - id
        - githubId
        - slug
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        githubId:
          type: integer
          format: int64
        slug:
          type: string
          example: devlens
        name:
          type: string
          example: DevLens
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateOrganizationRequest:
      type: object
      required:
        - githubId
        - slug
        - name
      properties:
        githubId:
          type: integer
          format: int64
          example: 123456
        slug:
          type: string
          example: devlens
        name:
          type: string
          example: DevLens

    UpdateOrganizationRequest:
      type: object
      properties:
        slug:
          type: string
          example: devlens-platform
        name:
          type: string
          example: DevLens Platform

    OrganizationResponse:
