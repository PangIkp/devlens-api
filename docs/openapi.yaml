openapi: 3.0.3

info:
  title: DevLens API
  version: 1.0.0
  description: |
    API contract สำหรับ DevLens Engineering Intelligence Platform

    Runtime behavior:
    - Responses include `X-Trace-Id` for request tracing.
    - The API may return `429 Too Many Requests` when server-side rate limits are exceeded.
    - Dynamic API responses include `Cache-Control: no-store`.

    Related documents:
    - 01-business-logic-architecture.md
    - 03-backend-roadmap.md
    - 04-metric-definitions.md
    - 05-database-design.dbml
    - 06-api-design.md

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Organizations
  - name: GitHub Connections
  - name: Pull Requests
  - name: Repositories
  - name: Sync Jobs
  - name: GitHub Webhooks
  - name: Dashboard
  - name: Pull Request Metrics
  - name: Review Metrics
  - name: Deployment Metrics
  - name: Hotspots
  - name: Insights
  - name: Organization Settings

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Create a user session
      description: Creates or updates a user record by email and returns an access token plus refresh token for the new session.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh an existing session
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      operationId: logout
      responses:
        "204":
          description: Session revoked successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Returns the currently authenticated user profile.
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /health:
    get:
      tags:
        - Health
      summary: Check API liveness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API process is alive and core stores are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessHealthResponse"
        "503":
          description: Core stores required for liveness are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessHealthResponse"

  /readiness:
    get:
      tags:
        - Health
      summary: Check API readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealthResponse"
        "503":
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealthResponse"

  /organizations:
    post:
      tags:
        - Organizations
      summary: Create organization
      description: Creates an organization and assigns the authenticated user as the initial owner.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Organizations
      summary: Get organizations accessible by current user
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{organizationId}:
    get:
      tags:
        - Organizations
      summary: Get organization detail
      operationId: getOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Organizations
      summary: Update organization
      operationId: updateOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Organizations
      summary: Soft delete organization
      operationId: deleteOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Organization deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/members:
    get:
      tags:
        - Organizations
      summary: Get organization members
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Organizations
      summary: Add organization member
      operationId: createOrganizationMember
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationMemberRequest"
      responses:
        "201":
          description: Organization member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/members/{memberId}:
    patch:
      tags:
        - Organizations
      summary: Update organization member role
      operationId: updateOrganizationMember
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRequest"
      responses:
        "200":
          description: Organization member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Organizations
      summary: Remove organization member
      operationId: deleteOrganizationMember
      description: This milestone uses hard delete for organization members because `organization_members.deleted_at` is not defined in PostgreSQL schema yet.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Organization member removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/repositories:
    post:
      tags:
        - Repositories
      summary: Create repository under an organization
      operationId: createRepository
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryRequest"
      responses:
        "201":
          description: Repository created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Repositories
      summary: Get repositories in an organization
      operationId: listRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RepositoryStatus"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"

  /organizations/{organizationId}/github/connection:
    get:
      tags:
        - GitHub Connections
      summary: Get GitHub connection status for an organization
      operationId: getGitHubConnection
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: GitHub connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - GitHub Connections
      summary: Disconnect the GitHub App installation for an organization
      description: >-
        Soft-disconnects the organization's GitHub App installation (sets
        disconnected_at) and cancels any in-progress sync jobs for its
        repositories. Historical data is retained and purged later per the
        configured retention window; reconnecting before that purge reuses
        the existing data.
      operationId: disconnectGitHubConnection
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: GitHub connection disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/installations/start:
    post:
      tags:
        - GitHub Connections
      summary: Start GitHub App installation flow for an organization
      operationId: startGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGitHubInstallationRequest"
      responses:
        "200":
          description: Installation flow started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartGitHubInstallationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/installations/callback:
    get:
      tags:
        - GitHub Connections
      summary: Complete GitHub App installation callback
      operationId: completeGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: installation_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
            example: install
      responses:
        "200":
          description: Installation callback handled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/repositories:
    get:
      tags:
        - GitHub Connections
      summary: List repositories accessible from the GitHub App installation
      operationId: listAccessibleGitHubRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Accessible repository list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccessibleRepositoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationId}/github/repositories/select:
    post:
      tags:
        - GitHub Connections
      summary: Select accessible GitHub repositories to connect and sync
      operationId: selectAccessibleGitHubRepositories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectGitHubRepositoriesRequest"
      responses:
        "202":
          description: Repository selection accepted and initial sync scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositorySelectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/settings/rules:
    get:
      tags:
        - Organization Settings
      summary: Get effective insight rule and metric rule settings for an organization
      description: >-
        Returns the effective configuration (stored overrides merged over
        the platform defaults) for the 6 insight rule types and the
        repository metrics rules (day type, hotspot weights). Fields an
        organization has never overridden report the platform default.
      operationId: getOrganizationRuleSettings
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Effective organization rule settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRuleSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Organization Settings
      summary: Update insight rule and metric rule settings for an organization
      description: >-
        Partially updates the organization's rule overrides. Only the
        sections/fields included in the request body change; omitted
        fields keep their previous value (or the platform default if never
        overridden). High-severity thresholds are not yet configurable and
        always use the platform default.
      operationId: updateOrganizationRuleSettings
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRuleSettingsRequest"
      responses:
        "200":
          description: Updated organization rule settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRuleSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"

  /organizations/{organizationId}/settings/retention:
    get:
      tags:
        - Organization Settings
      summary: Get analytics data retention settings for an organization
      description: >-
        Returns the organization's effective raw analytics data retention
        window in days. `enforced` is currently always `false`: the override
        is stored and reported here for the frontend to build against, but
        actual deletion still runs on a single global ClickHouse TTL applied
        to all organizations. Per-organization enforcement is a follow-up.
      operationId: getOrganizationRetentionSettings
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Effective organization retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRetentionSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Organization Settings
      summary: Update analytics data retention settings for an organization
      description: >-
        Sets the organization's raw analytics retention override in days.
        Not retroactive: lowering the value does not delete existing data
        immediately (see the `enforced` note on GET).
      operationId: updateOrganizationRetentionSettings
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRetentionSettingsRequest"
      responses:
        "200":
          description: Updated organization retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRetentionSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"

  /repositories/{repositoryId}:
    get:
      tags:
        - Repositories
      summary: Get repository detail
      operationId: getRepository
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: Repository detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Repositories
      summary: Update repository state or metadata
      operationId: updateRepository
      description: Use this endpoint to rename, change default branch, deactivate, or archive a repository without deleting historical records.
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
      responses:
        "200":
          description: Repository updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pull-requests/{pullRequestId}:
    get:
      tags:
        - Pull Requests
      summary: Get pull request detail
      operationId: getPullRequest
      parameters:
        - $ref: "#/components/parameters/PullRequestId"
      responses:
        "200":
          description: Pull request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /pull-requests:
    get:
      tags:
        - Pull Requests
      summary: List pull requests for a repository
      operationId: listPullRequests
      parameters:
        - $ref: "#/components/parameters/RepositoryIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/PullRequestStatus"
        - $ref: "#/components/parameters/PullRequestSortBy"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Pull request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/ValidationError"

  /repositories/{repositoryId}/sync:
    post:
      tags:
        - Sync Jobs
      summary: Start repository synchronization
      operationId: createRepositorySync
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSyncRequest"
      responses:
        "202":
          description: Sync job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /repositories/{repositoryId}/sync-jobs:
    get:
      tags:
        - Sync Jobs
      summary: Get repository synchronization history
      operationId: listRepositorySyncJobs
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SyncStatus"
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Sync job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sync-jobs/{syncJobId}:
    get:
      tags:
        - Sync Jobs
      summary: Get synchronization job detail
      operationId: getSyncJob
      parameters:
        - $ref: "#/components/parameters/SyncJobId"
      responses:
        "200":
          description: Sync job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sync-jobs/{syncJobId}/retry:
