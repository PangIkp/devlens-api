      properties:
        field:
          type: string
          example: from
        message:
          type: string
          example: from must be before or equal to to

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/ErrorDetail"
            - type: object
